name: Codex Review Gate

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_run:
    workflows: [Codex Review Signal]
    types: [completed]

# pull_request_target and workflow_run are privileged events. Keep this
# workflow metadata-only: never check out, build, or execute pull-request code.
permissions:
  actions: read
  contents: read
  pull-requests: read
  statuses: write

env:
  STATUS_CONTEXT: codex-review
  # Optional repository variable: comma- or whitespace-separated exact logins.
  # Defaults cover the current official Codex GitHub App login and its display
  # form. Matching is case-insensitive and the API user must also be a Bot.
  CONFIGURED_CODEX_BOT_LOGINS: ${{ vars.CODEX_REVIEW_BOT_LOGINS }}

jobs:
  mark-pending:
    name: Mark review pending
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    steps:
      - name: Set pending status for the current PR head
        uses: actions/github-script@v8
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        with:
          script: |
            const headSha = process.env.HEAD_SHA;
            const prNumber = Number(process.env.PR_NUMBER);
            if (!/^[0-9a-f]{40}$/i.test(headSha || '') || !Number.isInteger(prNumber)) {
              core.setFailed('The pull request payload did not contain a valid head SHA and number');
              return;
            }

            const configured = (process.env.CONFIGURED_CODEX_BOT_LOGINS || '')
              .split(/[\s,]+/)
              .map((login) => login.trim().toLowerCase())
              .filter(Boolean);
            const allowedLogins = new Set(configured.length ? configured : [
              'chatgpt-codex-connector',
              'chatgpt-codex-connector[bot]',
            ]);

            // A review event can race the lifecycle event. Avoid overwriting a
            // valid success that already exists for this exact head commit.
            const reviews = await github.paginate(github.rest.pulls.listReviews, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
              per_page: 100,
            });
            const exactHeadReviewExists = reviews.some((review) =>
              review.user?.type === 'Bot' &&
              allowedLogins.has((review.user.login || '').toLowerCase()) &&
              review.state !== 'DISMISSED' &&
              review.commit_id === headSha
            );

            const state = exactHeadReviewExists ? 'success' : 'pending';
            const description = exactHeadReviewExists
              ? 'Codex reviewed the current PR head'
              : 'Waiting for Codex to review the current PR head';

            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: headSha,
              state,
              context: process.env.STATUS_CONTEXT,
              description,
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

  mark-success:
    name: Accept current-head Codex review
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'pull_request_review' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Download submitted review signal
        uses: actions/download-artifact@v4
        with:
          name: codex-review-signal
          path: codex-review-signal
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Validate review and set success status
        uses: actions/github-script@v8
        env:
          SIGNAL_PATH: codex-review-signal/review-event.json
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
        with:
          script: |
            const fs = require('fs');

            let signal;
            try {
              signal = JSON.parse(fs.readFileSync(process.env.SIGNAL_PATH, 'utf8'));
            } catch (error) {
              core.setFailed(`Could not read the review signal: ${error.message}`);
              return;
            }

            const prNumber = Number(signal.pull_request);
            const reviewId = Number(signal.review_id);
            const sourceRunId = Number(process.env.SOURCE_RUN_ID);
            if (
              signal.repository !== `${context.repo.owner}/${context.repo.repo}` ||
              !Number.isInteger(prNumber) || prNumber < 1 ||
              !Number.isInteger(reviewId) || reviewId < 1 ||
              signal.source_run_id !== sourceRunId
            ) {
              core.setFailed('The review signal identifiers are invalid or belong to another run');
              return;
            }

            const configured = (process.env.CONFIGURED_CODEX_BOT_LOGINS || '')
              .split(/[\s,]+/)
              .map((login) => login.trim().toLowerCase())
              .filter(Boolean);
            const allowedLogins = new Set(configured.length ? configured : [
              'chatgpt-codex-connector',
              'chatgpt-codex-connector[bot]',
            ]);

            // Treat the artifact as untrusted input. Fetch both objects again
            // from GitHub and make the authorization decision on canonical data.
            const [{data: review}, {data: pullRequest}] = await Promise.all([
              github.rest.pulls.getReview({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: prNumber,
                review_id: reviewId,
              }),
              github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: prNumber,
              }),
            ]);

            const reviewerLogin = (review.user?.login || '').toLowerCase();
            if (review.user?.type !== 'Bot' || !allowedLogins.has(reviewerLogin)) {
              core.info(`Ignoring review ${reviewId}: reviewer is not an allowed Codex bot`);
              return;
            }

            if (review.state === 'DISMISSED') {
              core.info(`Ignoring review ${reviewId}: the review was dismissed`);
              return;
            }

            if (!review.commit_id || review.commit_id !== pullRequest.head.sha) {
              core.info(`Ignoring stale review ${reviewId}: it does not cover the current PR head`);
              return;
            }

            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: pullRequest.head.sha,
              state: 'success',
              context: process.env.STATUS_CONTEXT,
              description: 'Codex reviewed the current PR head',
              target_url: review.html_url || pullRequest.html_url,
            });
