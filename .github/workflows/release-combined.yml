name: Release Combined

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Exact release version, for example 0.3.1-preview.1"
        required: true
        type: string
      evidence_issue:
        description: "Release evidence issue number"
        required: true
        type: string
      prerelease:
        description: "Mark the GitHub release as a prerelease"
        required: true
        type: boolean
        default: true
      confirm:
        description: "Type RELEASE to confirm publication"
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write
  actions: read
  issues: read

jobs:
  release:
    runs-on: ubuntu-latest
    environment:
      name: release-approval
      url: https://github.com/${{ github.repository }}/issues/${{ inputs.evidence_issue }}
    steps:
      - name: Check out reviewed main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: .go-version
          check-latest: true
          cache: true

      - name: Verify source
        run: |
          set -euo pipefail
          test "$(git rev-parse --abbrev-ref HEAD)" = main
          test "${{ inputs.confirm }}" = RELEASE
          test "${{ inputs.evidence_issue }}" -eq "${{ inputs.evidence_issue }}"
          make bootstrap
          make generate
          make lint
          make test
          make build

      - name: Create immutable tag and release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
          EVIDENCE_ISSUE: ${{ inputs.evidence_issue }}
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-(preview|rc)\.[0-9]+)?$ ]]
          git rev-parse "refs/tags/v$VERSION" >/dev/null 2>&1 && { echo "tag exists" >&2; exit 2; } || true
          git tag -a "v$VERSION" -m "DepRail $VERSION" "$(git rev-parse HEAD)"
          git push origin "v$VERSION"
          prerelease_flag=()
          if [[ "${{ inputs.prerelease }}" == true ]]; then prerelease_flag+=(--prerelease); fi
          gh release create "v$VERSION" --target "$(git rev-parse HEAD)" "${prerelease_flag[@]}" --generate-notes --title "DepRail $VERSION" --notes "Release evidence: https://github.com/${{ github.repository }}/issues/$EVIDENCE_ISSUE"

      - name: Build release artifacts
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          commit="$(git rev-parse HEAD)"
          ldflags="-s -w -X github.com/geoffrey-xiao/deprail/internal/buildinfo.Version=v$VERSION -X github.com/geoffrey-xiao/deprail/internal/buildinfo.Tag=v$VERSION -X github.com/geoffrey-xiao/deprail/internal/buildinfo.Commit=$commit"
          for target in linux-amd64 darwin-amd64 darwin-arm64 windows-amd64; do
            IFS=- read -r goos goarch <<< "$target"
            suffix=""
            [[ "$goos" == windows ]] && suffix=.exe
            GOOS="$goos" GOARCH="$goarch" go build -trimpath -ldflags="$ldflags" -o "dist/deprail-$target$suffix" ./cmd/deprail
          done
          (cd dist && sha256sum deprail-*) > dist/SHA256SUMS

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: dist/deprail-${{ inputs.version }}.spdx.json
          upload-artifact: false

      - name: Upload release artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: gh release upload "v$VERSION" dist/* --repo "${{ github.repository }}" --clobber
