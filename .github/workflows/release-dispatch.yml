name: Release Dispatch

on:
  workflow_dispatch:
    inputs:
      strategy:
        description: "Choose manual or semantic version bump"
        required: true
        type: choice
        options:
          - manual
          - major
          - minor
          - patch
        default: manual
      version:
        description: "Exact version when strategy is manual"
        required: false
        type: string
      mode:
        description: "Release mode"
        required: true
        type: choice
        options:
          - preview
          - candidate
          - stable
        default: preview
      evidence_issue:
        description: "Release evidence issue number"
        required: true
        type: string
      confirm:
        description: "Type RELEASE to confirm the computed version"
        required: true
        type: string

permissions:
  contents: write
  issues: read

jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    environment:
      name: release-approval
      url: https://github.com/${{ github.repository }}/issues/${{ inputs.evidence_issue }}
    steps:
      - name: Check out reviewed main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Resolve and validate release version
        id: release
        env:
          STRATEGY: ${{ inputs.strategy }}
          REQUESTED_VERSION: ${{ inputs.version }}
          MODE: ${{ inputs.mode }}
          EVIDENCE_ISSUE: ${{ inputs.evidence_issue }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          [[ "$CONFIRM" == RELEASE ]] || { echo "Confirmation must be RELEASE" >&2; exit 2; }
          [[ "$EVIDENCE_ISSUE" =~ ^[0-9]+$ ]] || { echo "Invalid evidence issue" >&2; exit 2; }

          latest="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' | sed -E 's/^v//; s/-.*$//' | sort -V | tail -n 1)"
          [[ -n "$latest" ]] || latest=0.0.0
          IFS=. read -r major minor patch <<< "$latest"

          case "$STRATEGY" in
            manual)
              version="$REQUESTED_VERSION"
              ;;
            major)
              version="$((major + 1)).0.0"
              ;;
            minor)
              version="$major.$((minor + 1)).0"
              ;;
            patch)
              version="$major.$minor.$((patch + 1))"
              ;;
            *)
              echo "Unknown strategy: $STRATEGY" >&2
              exit 2
              ;;
          esac

          if [[ "$STRATEGY" != manual ]]; then
            case "$MODE" in
              preview)
                version="$version-preview.1"
                ;;
              candidate)
                version="$version-rc.1"
                ;;
              stable)
                ;;
              *)
                echo "Unknown release mode: $MODE" >&2
                exit 2
                ;;
            esac
          fi

          if [[ "$STRATEGY" == manual ]]; then
            case "$MODE" in
              preview) [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+-preview\.[0-9]+$ ]] || { echo "Manual preview requires -preview.N" >&2; exit 2; } ;;
              candidate) [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+-rc\.[0-9]+$ ]] || { echo "Manual candidate requires -rc.N" >&2; exit 2; } ;;
              stable) [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Manual stable requires stable SemVer" >&2; exit 2; } ;;
            esac
          fi

          tag="v$version"
          if git rev-parse "refs/tags/$tag" >/dev/null 2>&1; then
            echo "Release tag already exists: $tag" >&2
            exit 2
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Resolved release: $version"

      - name: Verify reviewed source
        run: make verify

      - name: Create immutable release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.release.outputs.version }}
          MODE: ${{ inputs.mode }}
          EVIDENCE_ISSUE: ${{ inputs.evidence_issue }}
        run: |
          set -euo pipefail
          prerelease_flag=()
          if [[ "$MODE" != stable ]]; then prerelease_flag+=(--prerelease); fi
          gh release create "v$VERSION" \
            --target main \
            "${prerelease_flag[@]}" \
            --generate-notes \
            --title "DepRail $VERSION" \
            --notes "Release evidence: https://github.com/${{ github.repository }}/issues/$EVIDENCE_ISSUE"
