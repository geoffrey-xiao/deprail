name: Release Dispatch

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, for example 0.3.1-preview.1"
        required: true
        type: string
      mode:
        description: "Release mode"
        required: true
        type: choice
        options:
          - preview
          - candidate
          - stable
        default: preview
      evidence_issue:
        description: "Release evidence issue number"
        required: true
        type: string

permissions:
  contents: write
  issues: read

jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    environment:
      name: release-approval
      url: https://github.com/${{ github.repository }}/issues/${{ inputs.evidence_issue }}
    steps:
      - name: Check out reviewed main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Validate release inputs
        env:
          VERSION: ${{ inputs.version }}
          MODE: ${{ inputs.mode }}
          EVIDENCE_ISSUE: ${{ inputs.evidence_issue }}
        run: |
          set -euo pipefail
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-(preview|rc)\.[0-9]+)?$ ]]; then
            echo "Invalid release version: $VERSION" >&2
            exit 2
          fi
          if [[ ! "$EVIDENCE_ISSUE" =~ ^[0-9]+$ ]]; then
            echo "Invalid evidence issue: $EVIDENCE_ISSUE" >&2
            exit 2
          fi
          case "$MODE" in
            preview) [[ "$VERSION" == *-preview.* ]] || { echo "Preview mode requires a -preview.N version" >&2; exit 2; } ;;
            candidate) [[ "$VERSION" == *-rc.* ]] || { echo "Candidate mode requires an -rc.N version" >&2; exit 2; } ;;
            stable) [[ "$VERSION" != *-* ]] || { echo "Stable mode cannot use a prerelease version" >&2; exit 2; } ;;
          esac
          if git rev-parse "refs/tags/v$VERSION" >/dev/null 2>&1; then
            echo "Release tag already exists: v$VERSION" >&2
            exit 2
          fi

      - name: Verify reviewed source
        run: make verify

      - name: Create immutable release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
          MODE: ${{ inputs.mode }}
          EVIDENCE_ISSUE: ${{ inputs.evidence_issue }}
        run: |
          set -euo pipefail
          tag="v$VERSION"
          prerelease_flag=()
          if [[ "$MODE" != stable ]]; then
            prerelease_flag+=(--prerelease)
          fi
          gh release create "$tag" \
            --target main \
            "${prerelease_flag[@]}" \
            --generate-notes \
            --title "DepRail $VERSION" \
            --notes "Release evidence: https://github.com/${{ github.repository }}/issues/$EVIDENCE_ISSUE"
