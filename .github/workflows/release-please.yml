name: Release Please

on:
  workflow_dispatch:
    inputs:
      reason:
        description: "Reason for manually checking release state"
        required: false
        default: "manual release check"
      release_as:
        description: "Explicit release version, for example 0.3.1-preview.1"
        required: false
        default: ""
permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - name: Create or update release PR
        id: release
        uses: googleapis/release-please-action@v4.2.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          release-as: ${{ inputs.release_as }}
