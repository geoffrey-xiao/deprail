name: Release Artifacts

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: .go-version
          check-latest: true
          cache: true

      - name: Verify source
        run: make verify

      - name: Build release artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          for target in linux-amd64 darwin-amd64 darwin-arm64 windows-amd64; do
            IFS=- read -r goos goarch <<< "$target"
            suffix=""
            if [[ "$goos" == windows ]]; then suffix=".exe"; fi
            GOOS="$goos" GOARCH="$goarch" go build -trimpath -ldflags='-s -w' -o "dist/deprail-${target}${suffix}" ./cmd/deprail
          done
          (cd dist && sha256sum deprail-*) > dist/SHA256SUMS

      - name: Run release smoke checks
        shell: bash
        run: |
          set -euo pipefail
          ./dist/deprail-linux-amd64 doctor --format json > /tmp/doctor.json || test "$?" -eq 3
          test -s /tmp/doctor.json
          ./dist/deprail-linux-amd64 discover testdata/fixtures/mixed-repository --format json > /tmp/discover.json
          test -s /tmp/discover.json

      - name: Upload artifacts to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" dist/* --clobber
