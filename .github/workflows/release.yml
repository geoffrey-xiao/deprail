name: Release Artifacts

on:
  release:
    types: [published]

permissions:
  contents: read
  actions: read

jobs:
  build:
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: .go-version
          check-latest: true
          cache: true

      - name: Verify source
        run: make verify

      - name: Build release artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          tag="${{ github.event.release.tag_name }}"
          commit="$(git rev-parse HEAD)"
          ldflags="-s -w -X github.com/geoffrey-xiao/deprail/internal/buildinfo.Version=${tag} -X github.com/geoffrey-xiao/deprail/internal/buildinfo.Tag=${tag} -X github.com/geoffrey-xiao/deprail/internal/buildinfo.Commit=${commit}"
          for target in linux-amd64 darwin-amd64 darwin-arm64 windows-amd64; do
            IFS=- read -r goos goarch <<< "$target"
            suffix=""
            if [[ "$goos" == windows ]]; then suffix=".exe"; fi
            GOOS="$goos" GOARCH="$goarch" go build -trimpath -ldflags="$ldflags" -o "dist/deprail-${target}${suffix}" ./cmd/deprail
          done
          (cd dist && sha256sum deprail-*) > dist/SHA256SUMS
      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: dist/deprail-${{ github.event.release.tag_name }}.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign release artifacts
        shell: bash
        run: |
          set -euo pipefail
          for artifact in dist/deprail-*; do
            case "$artifact" in
              *.sig|*.pem) continue ;;
            esac
            cosign sign-blob \
              --yes \
              --output-signature "${artifact}.sig" \
              --output-certificate "${artifact}.pem" \
              "$artifact"
          done

      - name: Verify release signatures
        shell: bash
        run: |
          set -euo pipefail
          for artifact in dist/deprail-*; do
            case "$artifact" in
              *.sig|*.pem) continue ;;
            esac
            cosign verify-blob \
              --signature "${artifact}.sig" \
              --certificate "${artifact}.pem" \
              --certificate-identity-regexp 'https://github.com/${{ github.repository }}/.github/workflows/release.yml@refs/tags/.*' \
              --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
              "$artifact"
          done

      - name: Attest release artifacts
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/deprail-linux-amd64
            dist/deprail-darwin-amd64
            dist/deprail-darwin-arm64
            dist/deprail-windows-amd64.exe

      - name: Verify build provenance
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          for artifact in \
            dist/deprail-linux-amd64 \
            dist/deprail-darwin-amd64 \
            dist/deprail-darwin-arm64 \
            dist/deprail-windows-amd64.exe; do
            gh attestation verify "$artifact" --repo "${{ github.repository }}"
          done

      - name: Verify checksums, signatures, and release controls
        shell: bash
        run: |
          set -euo pipefail
          (cd dist && sha256sum -c SHA256SUMS)
          test -s "dist/deprail-${{ github.event.release.tag_name }}.spdx.json"
          test -s dist/deprail-linux-amd64.sig
          test -s dist/deprail-linux-amd64.pem

      - name: Run release smoke checks
        shell: bash
        run: |
          set -euo pipefail
          ./dist/deprail-linux-amd64 doctor --format json > /tmp/doctor.json || test "$?" -eq 3
          test -s /tmp/doctor.json
          ./dist/deprail-linux-amd64 discover testdata/fixtures/mixed-repository --format json > /tmp/discover.json
          test -s /tmp/discover.json

      - name: Store release artifacts for approval
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: dist/*

  manual-verify:
    name: Manual release approval and publication
    needs: build
    permissions:
      contents: write
      actions: read
    runs-on: ubuntu-latest
    environment:
      name: release-approval
      url: https://github.com/${{ github.repository }}/releases/tag/${{ github.event.release.tag_name }}
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-artifacts
          path: dist

      - name: Verify checksums
        working-directory: dist
        run: sha256sum -c SHA256SUMS

      - name: Upload approved artifacts to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" --repo "${{ github.repository }}" dist/* --clobber
