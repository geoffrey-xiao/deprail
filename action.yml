name: DepRail

description: Run the pinned DepRail dependency security guardrail.
author: DepRail maintainers
branding:
  icon: shield
  color: blue

inputs:
  version:
    description: DepRail release or immutable commit to execute.
    required: false
    default: v0.2.0
  path:
    description: Repository path to scan.
    required: false
    default: .
  format:
    description: Output format.
    required: false
    default: json
  policy:
    description: Run policy check after scanning.
    required: false
    default: 'false'

outputs:
  report:
    description: Path to the machine-readable DepRail report.
  sarif:
    description: Path to the SARIF report when generated.

runs:
  using: composite
  steps:
    - name: Run DepRail scan
      shell: bash
      env:
        DEPRAIL_VERSION: ${{ inputs.version }}
        DEPRAIL_PATH: ${{ inputs.path }}
        DEPRAIL_FORMAT: ${{ inputs.format }}
      run: |
        set -euo pipefail
        test -n "$DEPRAIL_VERSION"
        test -d "$DEPRAIL_PATH"
        command -v deprail >/dev/null 2>&1 || { echo 'deprail must be installed by the caller at a pinned version' >&2; exit 2; }
        deprail scan "$DEPRAIL_PATH" --format "$DEPRAIL_FORMAT" | tee deprail-report.json
    - name: Upload DepRail report
      uses: actions/upload-artifact@v4
      with:
        name: deprail-report
        path: deprail-report.json
