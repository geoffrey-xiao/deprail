<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1040" viewBox="0 0 1440 1040" role="img" aria-labelledby="title desc">
  <title id="title">DepRail About and local-data help — draft</title>
  <desc id="desc">Static, read-only About page explaining local console scope, saved history, unavailable scan and publishing controls, and unapproved data-location and retention details. No absolute host paths are shown. Illustrative content only.</desc>
  <defs>
    <style>
      text { font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #111827; }
      .muted { fill: #475569; }
      .soft { fill: #64748b; }
      .small { font-size: 13px; }
      .body { font-size: 15px; }
      .label { font-size: 12px; font-weight: 650; letter-spacing: .04em; }
      .heading { font-size: 30px; font-weight: 720; letter-spacing: -.02em; }
      .section { font-size: 19px; font-weight: 680; }
      .border { stroke: #dbe2ea; stroke-width: 1; }
    </style>
  </defs>
  <rect width="1440" height="1040" fill="#f6f8fb"/>
  <rect width="1440" height="72" fill="#ffffff"/>
  <path d="M0 71.5H1440" stroke="#e2e8f0"/>
  <rect x="144" y="16" width="40" height="40" rx="12" fill="#14243a"/>
  <path d="M164 24l11 5v8c0 8-5 13-11 16-6-3-11-8-11-16v-8z" fill="none" stroke="#ffffff" stroke-width="2"/>
  <path d="M159 37l4 4 7-8" fill="none" stroke="#93c5fd" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="196" y="39" font-size="18" font-weight="720">DepRail</text>
  <text x="266" y="39" class="small muted">Local console</text>
  <text x="1040" y="40" class="small muted">Scan history</text>
  <rect x="1110" y="18" width="104" height="36" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="1162" y="41" text-anchor="middle" class="small" font-weight="650" fill="#1e40af">About</text>
  <rect x="1240" y="22" width="142" height="28" rx="14" fill="#eff6ff" stroke="#bfdbfe"/>
  <circle cx="1257" cy="36" r="4" fill="#1d4ed8"/>
  <text x="1269" y="40" font-size="12" font-weight="650" fill="#1e40af">LOCAL ONLY</text>

  <text x="160" y="128" class="small muted">DepRail  /  About</text>
  <text x="160" y="180" class="heading">About the local console</text>
  <text x="160" y="211" class="body muted">How saved scan history works on this device, and which details are still being finalized.</text>
  <text x="1280" y="180" text-anchor="end" class="small muted">Draft · static help</text>

  <rect x="160" y="246" width="1120" height="112" rx="12" fill="#eff6ff" stroke="#bfdbfe"/>
  <circle cx="190" cy="281" r="11" fill="#dbeafe"/>
  <path d="M190 274v8l5 3" fill="none" stroke="#1d4ed8" stroke-width="1.8" stroke-linecap="round"/>
  <text x="214" y="280" class="section" fill="#1e3a8a">Local, read-only console</text>
  <text x="184" y="316" class="body" fill="#1e3a8a">The browser reads saved scan results from the local DepRail process. This view offers no scan, upload, or publish action.</text>
  <text x="1248" y="280" text-anchor="end" class="label" fill="#1e40af">NO REMOTE WORKSPACE</text>

  <g transform="translate(160 390)">
    <rect width="676" height="238" rx="12" fill="#ffffff" stroke="#dbe2ea"/>
    <text x="24" y="40" class="section">What you can review</text>
    <text x="24" y="76" class="body muted">Saved entries provide context for previously completed local work:</text>
    <circle cx="32" cy="112" r="4" fill="#1d4ed8"/>
    <text x="48" y="117" class="body">Operation outcome and report completeness, shown separately.</text>
    <circle cx="32" cy="151" r="4" fill="#1d4ed8"/>
    <text x="48" y="156" class="body">Findings, workspace context, diagnostics, and provenance when available.</text>
    <circle cx="32" cy="190" r="4" fill="#1d4ed8"/>
    <text x="48" y="195" class="body">Existing scan workflows remain available through the CLI.</text>
    <text x="24" y="222" class="small soft">Partial or failed reports are not represented as a clean result.</text>
  </g>

  <g transform="translate(860 390)">
    <rect width="420" height="238" rx="12" fill="#ffffff" stroke="#dbe2ea"/>
    <text x="24" y="40" class="section">Read-only by design</text>
    <text x="24" y="78" class="body muted">This help view has no controls to:</text>
    <text x="32" y="111" class="body">• Start a scan</text>
    <text x="32" y="143" class="body">• Upload or publish results</text>
    <text x="32" y="175" class="body">• Reset, delete, or export saved data</text>
    <text x="24" y="215" class="small soft">No team, agent-write, or remediation actions.</text>
  </g>

  <g transform="translate(160 660)">
    <rect width="1120" height="210" rx="12" fill="#ffffff" stroke="#dbe2ea"/>
    <text x="24" y="42" class="section">Data location and lifecycle</text>
    <rect x="24" y="64" width="152" height="28" rx="14" fill="#fef3c7"/>
    <circle cx="41" cy="78" r="4" fill="#92400e"/>
    <text x="53" y="82" class="small" font-weight="650" fill="#78350f">Not finalized</text>
    <text x="24" y="124" class="body muted">The exact data directory, retention, and file-permission behavior remain subject to the approved v0.5 storage contract.</text>
    <text x="24" y="153" class="body muted">This draft intentionally shows no absolute host path and makes no retention or deletion promise.</text>
    <text x="24" y="190" class="small soft">A later approved contract must provide user-facing location and recovery guidance.</text>
  </g>

  <text x="160" y="927" class="small soft">Draft visual reference · About/help is static and read-only · no host paths or destructive controls are shown.</text>
  <text x="160" y="955" class="small soft">At narrow widths, the information cards stack in reading order; browser, keyboard, and screen-reader behavior still require verification.</text>
</svg>
