<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000" role="img" aria-labelledby="title desc">
  <title id="title">DepRail local scan history — desktop draft</title>
  <desc id="desc">Illustrative desktop scan history page with cancelled/complete and completed/failed examples. Data is synthetic.</desc>
  <defs>
    <style>
      text { font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #111827; }
      .muted { fill: #475569; }
      .soft { fill: #64748b; }
      .small { font-size: 13px; }
      .body { font-size: 15px; }
      .label { font-size: 12px; font-weight: 650; letter-spacing: .04em; }
      .heading { font-size: 30px; font-weight: 700; letter-spacing: -.02em; }
      .border { stroke: #dbe2ea; stroke-width: 1; }
    </style>
  </defs>
  <rect width="1440" height="1000" fill="#f6f8fb"/>
  <rect width="1440" height="72" fill="#ffffff"/>
  <path d="M0 71.5H1440" stroke="#e2e8f0"/>
  <rect x="144" y="16" width="40" height="40" rx="12" fill="#14243a"/>
  <path d="M164 24l11 5v8c0 8-5 13-11 16-6-3-11-8-11-16v-8z" fill="none" stroke="#ffffff" stroke-width="2"/>
  <path d="M159 37l4 4 7-8" fill="none" stroke="#93c5fd" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="196" y="39" font-size="18" font-weight="720">DepRail</text>
  <text x="266" y="39" class="small muted">Local console</text>
  <rect x="1115" y="22" width="142" height="28" rx="14" fill="#eff6ff" stroke="#bfdbfe"/>
  <circle cx="1132" cy="36" r="4" fill="#1d4ed8"/>
  <text x="1144" y="40" font-size="12" font-weight="650" fill="#1e40af">LOCAL ONLY</text>
  <text x="1282" y="40" class="small muted">On this device</text>

  <g transform="translate(160 116)">
    <text y="0" class="small muted">DepRail  /  Scan history</text>
    <text y="58" class="heading">Scan history</text>
    <text y="87" class="body muted">Saved scan operations on this device.</text>
    <rect x="0" y="116" width="1120" height="60" rx="10" fill="#eef2f7"/>
    <circle cx="26" cy="146" r="10" fill="#dbeafe"/>
    <path d="M26 139v7l5 3" fill="none" stroke="#1d4ed8" stroke-width="1.8" stroke-linecap="round"/>
    <text x="46" y="143" class="body" font-weight="650">History stays local</text>
    <text x="46" y="162" class="small muted">This view shows saved records only; it does not start or change a scan.</text>
    <text x="1120" y="151" text-anchor="end" class="small muted">Illustrative data</text>

    <rect x="0" y="198" width="1120" height="620" rx="12" fill="#ffffff" stroke="#dbe2ea"/>
    <text x="24" y="234" font-size="17" font-weight="680">Recent scans</text>
    <text x="24" y="258" class="small muted">Newest first · outcome and report status are shown separately</text>
    <rect x="930" y="216" width="166" height="36" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
    <path d="M950 230h13m-13 5h13m-13 5h13" stroke="#475569" stroke-width="1.5"/>
    <text x="974" y="239" class="small" font-weight="600">Refresh history</text>

    <rect x="1" y="278" width="1118" height="48" fill="#f8fafc"/>
    <text x="24" y="308" class="label muted">REPOSITORY / HISTORY ENTRY</text>
    <text x="438" y="308" class="label muted">OPERATION OUTCOME</text>
    <text x="625" y="308" class="label muted">REPORT COMPLETENESS</text>
    <text x="835" y="308" class="label muted">FINDINGS</text>
    <text x="960" y="308" class="label muted">STARTED</text>
    <path d="M1 326H1119" class="border"/>

    <g transform="translate(0 326)">
      <rect x="1" y="0" width="1118" height="105" fill="#fffbeb" opacity=".44"/>
      <text x="24" y="34" font-size="15" font-weight="650" fill="#1d4ed8" text-decoration="underline">atlas-api →</text>
      <text x="24" y="56" class="small muted">h_01JQ8W9K2M · source scan s_84b2…</text>
      <text x="24" y="78" class="small soft">services/atlas-api</text>
      <rect x="438" y="24" width="112" height="28" rx="14" fill="#fef3c7"/>
      <circle cx="454" cy="38" r="4" fill="#92400e"/>
      <text x="466" y="42" font-size="13" font-weight="650" fill="#78350f">Cancelled</text>
      <rect x="625" y="24" width="99" height="28" rx="14" fill="#dcfce7"/>
      <circle cx="641" cy="38" r="4" fill="#166534"/>
      <text x="653" y="42" font-size="13" font-weight="650" fill="#14532d">Complete</text>
      <text x="835" y="42" class="body" font-weight="650">12</text>
      <text x="960" y="39" class="small">Apr 17, 2026</text>
      <text x="960" y="58" class="small muted">10:42 AM</text>
      <path d="M1 104H1119" class="border"/>
    </g>
    <g transform="translate(0 431)">
      <text x="24" y="34" font-size="15" font-weight="650" fill="#1d4ed8" text-decoration="underline">inventory-worker →</text>
      <text x="24" y="56" class="small muted">h_01JQ8P3D6A · source scan s_5d10…</text>
      <text x="24" y="78" class="small soft">workers/inventory</text>
      <rect x="438" y="24" width="112" height="28" rx="14" fill="#dcfce7"/>
      <circle cx="454" cy="38" r="4" fill="#166534"/>
      <text x="466" y="42" font-size="13" font-weight="650" fill="#14532d">Completed</text>
      <rect x="625" y="24" width="84" height="28" rx="14" fill="#fef3c7"/>
      <circle cx="641" cy="38" r="4" fill="#92400e"/>
      <text x="653" y="42" font-size="13" font-weight="650" fill="#78350f">Partial</text>
      <text x="835" y="42" class="body" font-weight="650">6</text>
      <text x="960" y="39" class="small">Apr 16, 2026</text>
      <text x="960" y="58" class="small muted">4:07 PM</text>
      <path d="M1 104H1119" class="border"/>
    </g>
    <g transform="translate(0 536)">
      <text x="24" y="34" font-size="15" font-weight="650" fill="#1d4ed8" text-decoration="underline">web-store →</text>
      <text x="24" y="56" class="small muted">h_01JQ7K1F2R · source scan s_215f…</text>
      <text x="24" y="78" class="small soft">apps/store</text>
      <rect x="438" y="24" width="112" height="28" rx="14" fill="#dcfce7"/>
      <circle cx="454" cy="38" r="4" fill="#166534"/>
      <text x="466" y="42" font-size="13" font-weight="650" fill="#14532d">Completed</text>
      <rect x="625" y="24" width="99" height="28" rx="14" fill="#fee2e2"/>
      <circle cx="641" cy="38" r="4" fill="#991b1b"/>
      <text x="653" y="42" font-size="13" font-weight="650" fill="#7f1d1d">Failed</text>
      <text x="835" y="42" class="body muted">—</text>
      <text x="960" y="39" class="small">Apr 16, 2026</text>
      <text x="960" y="58" class="small muted">11:22 AM</text>
      <path d="M1 104H1119" class="border"/>
    </g>
    <g transform="translate(0 641)">
      <text x="24" y="34" font-size="15" font-weight="650" fill="#1d4ed8" text-decoration="underline">billing-api →</text>
      <text x="24" y="56" class="small muted">h_01JQ6Z8W0C · source scan unavailable</text>
      <text x="24" y="78" class="small soft">services/billing</text>
      <rect x="438" y="24" width="91" height="28" rx="14" fill="#fee2e2"/>
      <circle cx="454" cy="38" r="4" fill="#991b1b"/>
      <text x="466" y="42" font-size="13" font-weight="650" fill="#7f1d1d">Failed</text>
      <rect x="625" y="24" width="111" height="28" rx="14" fill="#f1f5f9"/>
      <circle cx="641" cy="38" r="4" fill="#475569"/>
      <text x="653" y="42" font-size="13" font-weight="650" fill="#334155">Unavailable</text>
      <text x="835" y="42" class="body muted">—</text>
      <text x="960" y="39" class="small">Apr 15, 2026</text>
      <text x="960" y="58" class="small muted">9:04 AM</text>
    </g>

    <path d="M1 750H1119" class="border"/>
    <text x="24" y="783" class="small muted">Showing 1–4 of 18 saved scans</text>
    <rect x="858" y="760" width="92" height="36" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="904" y="783" text-anchor="middle" class="small" fill="#94a3b8">Previous</text>
    <rect x="964" y="760" width="132" height="36" rx="8" fill="#ffffff" stroke="#94a3b8"/>
    <text x="1030" y="783" text-anchor="middle" class="small" font-weight="650">Next page  →</text>
  </g>
  <text x="160" y="970" class="small soft">Draft visual reference · sample repository names and identifiers are fictional · no scan controls are available in this console.</text>
</svg>
