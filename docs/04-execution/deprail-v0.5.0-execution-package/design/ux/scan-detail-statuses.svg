<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1030" viewBox="0 0 1440 1030" role="img" aria-labelledby="title desc">
  <title id="title">DepRail scan detail outcome and report states — draft</title>
  <desc id="desc">Four illustrative scan-detail states demonstrate that operation outcome and report completeness are independent: completed partial report, completed failed report, failed operation without a report, and completed complete report with zero findings. Data is synthetic.</desc>
  <defs>
    <style>
      text { font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #111827; }
      .muted { fill: #475569; }
      .soft { fill: #64748b; }
      .small { font-size: 13px; }
      .body { font-size: 15px; }
      .label { font-size: 12px; font-weight: 650; letter-spacing: .04em; }
      .title { font-size: 20px; font-weight: 700; }
    </style>
  </defs>
  <rect width="1440" height="1030" fill="#f6f8fb"/>
  <rect width="1440" height="72" fill="#ffffff"/>
  <path d="M0 71.5H1440" stroke="#e2e8f0"/>
  <rect x="144" y="16" width="40" height="40" rx="12" fill="#14243a"/>
  <path d="M164 24l11 5v8c0 8-5 13-11 16-6-3-11-8-11-16v-8z" fill="none" stroke="#ffffff" stroke-width="2"/>
  <path d="M159 37l4 4 7-8" fill="none" stroke="#93c5fd" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="196" y="39" font-size="18" font-weight="720">DepRail</text>
  <text x="266" y="39" class="small muted">Local console</text>
  <rect x="1115" y="22" width="142" height="28" rx="14" fill="#eff6ff" stroke="#bfdbfe"/>
  <circle cx="1132" cy="36" r="4" fill="#1d4ed8"/>
  <text x="1144" y="40" font-size="12" font-weight="650" fill="#1e40af">LOCAL ONLY</text>
  <text x="1282" y="40" class="small muted">Illustrative data</text>

  <text x="96" y="128" class="small muted">DepRail  /  Scan detail state references</text>
  <text x="96" y="178" font-size="30" font-weight="720" letter-spacing="-.02em">Operation outcome and report completeness</text>
  <text x="96" y="208" class="body muted">Each axis is labeled independently. An incomplete or missing report is never a clean zero-finding result.</text>
  <text x="1344" y="178" text-anchor="end" class="small muted">Draft · synthetic examples</text>

  <g transform="translate(96 244)">
    <rect width="600" height="330" rx="12" fill="#ffffff" stroke="#dbe2ea"/>
    <text x="24" y="36" class="label muted">01 · COMPLETED OPERATION / PARTIAL REPORT</text>
    <text x="24" y="70" class="title">Results are incomplete</text>
    <rect x="24" y="90" width="264" height="82" rx="9" fill="#f8fafc" stroke="#dbe2ea"/>
    <text x="40" y="114" class="label muted">OPERATION OUTCOME</text>
    <rect x="40" y="128" width="104" height="27" rx="14" fill="#dcfce7"/>
    <circle cx="56" cy="141.5" r="4" fill="#166534"/>
    <text x="68" y="146" class="small" font-weight="680" fill="#14532d">Completed</text>
    <rect x="312" y="90" width="264" height="82" rx="9" fill="#f8fafc" stroke="#dbe2ea"/>
    <text x="328" y="114" class="label muted">REPORT COMPLETENESS</text>
    <rect x="328" y="128" width="82" height="27" rx="14" fill="#fef3c7"/>
    <circle cx="344" cy="141.5" r="4" fill="#92400e"/>
    <text x="356" y="146" class="small" font-weight="680" fill="#78350f">Partial</text>
    <rect x="24" y="190" width="552" height="76" rx="9" fill="#fffbeb" stroke="#fcd34d"/>
    <text x="42" y="218" class="body" font-weight="680" fill="#78350f">Some detected targets are incomplete.</text>
    <text x="42" y="242" class="small" fill="#78350f">4 findings returned · 1 workspace incomplete · diagnostics available</text>
    <text x="24" y="302" class="small muted">Show returned evidence and the omitted scope; never label this clean.</text>
  </g>

  <g transform="translate(744 244)">
    <rect width="600" height="330" rx="12" fill="#ffffff" stroke="#dbe2ea"/>
    <text x="24" y="36" class="label muted">02 · COMPLETED OPERATION / FAILED REPORT</text>
    <text x="24" y="70" class="title">The report could not be used</text>
    <rect x="24" y="90" width="264" height="82" rx="9" fill="#f8fafc" stroke="#dbe2ea"/>
    <text x="40" y="114" class="label muted">OPERATION OUTCOME</text>
    <rect x="40" y="128" width="104" height="27" rx="14" fill="#dcfce7"/>
    <circle cx="56" cy="141.5" r="4" fill="#166534"/>
    <text x="68" y="146" class="small" font-weight="680" fill="#14532d">Completed</text>
    <rect x="312" y="90" width="264" height="82" rx="9" fill="#f8fafc" stroke="#dbe2ea"/>
    <text x="328" y="114" class="label muted">REPORT COMPLETENESS</text>
    <rect x="328" y="128" width="80" height="27" rx="14" fill="#fee2e2"/>
    <circle cx="344" cy="141.5" r="4" fill="#991b1b"/>
    <text x="356" y="146" class="small" font-weight="680" fill="#7f1d1d">Failed</text>
    <rect x="24" y="190" width="552" height="76" rx="9" fill="#fef2f2" stroke="#fecaca"/>
    <text x="42" y="218" class="body" font-weight="680" fill="#7f1d1d">Report data is unavailable.</text>
    <text x="42" y="242" class="small" fill="#7f1d1d">Findings unavailable · show safe diagnostics, not 0 findings</text>
    <text x="24" y="302" class="small muted">A completed operation does not imply a valid or complete report.</text>
  </g>

  <g transform="translate(96 604)">
    <rect width="600" height="330" rx="12" fill="#ffffff" stroke="#dbe2ea"/>
    <text x="24" y="36" class="label muted">03 · FAILED OPERATION / NO REPORT</text>
    <text x="24" y="70" class="title">No report was produced</text>
    <rect x="24" y="90" width="264" height="82" rx="9" fill="#f8fafc" stroke="#dbe2ea"/>
    <text x="40" y="114" class="label muted">OPERATION OUTCOME</text>
    <rect x="40" y="128" width="82" height="27" rx="14" fill="#fee2e2"/>
    <circle cx="56" cy="141.5" r="4" fill="#991b1b"/>
    <text x="68" y="146" class="small" font-weight="680" fill="#7f1d1d">Failed</text>
    <rect x="312" y="90" width="264" height="82" rx="9" fill="#f8fafc" stroke="#dbe2ea"/>
    <text x="328" y="114" class="label muted">REPORT</text>
    <rect x="328" y="128" width="116" height="27" rx="14" fill="#f1f5f9"/>
    <circle cx="344" cy="141.5" r="4" fill="#475569"/>
    <text x="356" y="146" class="small" font-weight="680" fill="#334155">Unavailable</text>
    <rect x="24" y="190" width="552" height="76" rx="9" fill="#fef2f2" stroke="#fecaca"/>
    <text x="42" y="218" class="body" font-weight="680" fill="#7f1d1d">Execution failed before a report was saved.</text>
    <text x="42" y="242" class="small" fill="#7f1d1d">Findings unavailable · retain the operation diagnostic</text>
    <text x="24" y="302" class="small muted">No report is not the same state as a failed report.</text>
  </g>

  <g transform="translate(744 604)">
    <rect width="600" height="330" rx="12" fill="#ffffff" stroke="#dbe2ea"/>
    <text x="24" y="36" class="label muted">04 · COMPLETED OPERATION / COMPLETE REPORT</text>
    <text x="24" y="70" class="title">Complete report with zero findings</text>
    <rect x="24" y="90" width="264" height="82" rx="9" fill="#f8fafc" stroke="#dbe2ea"/>
    <text x="40" y="114" class="label muted">OPERATION OUTCOME</text>
    <rect x="40" y="128" width="104" height="27" rx="14" fill="#dcfce7"/>
    <circle cx="56" cy="141.5" r="4" fill="#166534"/>
    <text x="68" y="146" class="small" font-weight="680" fill="#14532d">Completed</text>
    <rect x="312" y="90" width="264" height="82" rx="9" fill="#f8fafc" stroke="#dbe2ea"/>
    <text x="328" y="114" class="label muted">REPORT COMPLETENESS</text>
    <rect x="328" y="128" width="98" height="27" rx="14" fill="#dcfce7"/>
    <circle cx="344" cy="141.5" r="4" fill="#166534"/>
    <text x="356" y="146" class="small" font-weight="680" fill="#14532d">Complete</text>
    <rect x="24" y="190" width="552" height="76" rx="9" fill="#f0fdf4" stroke="#bbf7d0"/>
    <text x="42" y="218" class="body" font-weight="680" fill="#14532d">0 findings in this complete report.</text>
    <text x="42" y="242" class="small" fill="#14532d">The successful response confirms the collection is complete.</text>
    <text x="24" y="302" class="small muted">This is not the empty-history state or a missing report.</text>
  </g>

  <text x="96" y="980" class="small soft">Draft visual references · status meaning uses text and labels, not color alone · synthetic examples.</text>
</svg>
